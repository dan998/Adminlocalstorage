<!DOCTYPE html>
<html>
<head>
<title>User Withdrawal</title>

<style>
body{
    font-family:Arial;
    background:#0f172a;
    color:white;
    padding:30px;
}

.box{
    max-width:400px;
    margin:auto;
    background:#1e293b;
    padding:20px;
    border-radius:10px;
}

input,button{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:5px;
}

button{
    background:#22c55e;
    color:white;
    cursor:pointer;
}
</style>

</head>

<body>

<div class="box">

<h2>Withdrawal Request</h2>

<input id="username" placeholder="Username">

<input id="amount" placeholder="Amount">

<button onclick="sendRequest()">
Send Request
</button>

<p id="message"></p>

</div>


<script>

function sendRequest(){

let username =
document.getElementById("username").value;

let amount =
document.getElementById("amount").value;


let request = {

username: username,

amount: amount,

status:"Pending",

date:new Date().toLocaleString()

};


// Save request

localStorage.setItem(
"withdrawalRequest",
JSON.stringify(request)
);


document.getElementById("message").innerHTML =
"Request saved successfully";


}

</script>


</body>
</html>
