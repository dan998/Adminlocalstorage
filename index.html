<!DOCTYPE html>
<html>

<head>

<title>User Withdrawal</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
padding:30px;
}


.box{
max-width:400px;
margin:auto;
background:#1e293b;
padding:20px;
border-radius:10px;
}


input,button{

width:100%;
padding:12px;
margin:10px 0;
border-radius:5px;
border:none;

}


button{

background:#22c55e;
color:white;

}

</style>

</head>


<body>


<div class="box">


<h2>
Withdrawal Request
</h2>


<input id="username"
placeholder="Username">


<input id="amount"
placeholder="Amount">


<button onclick="sendRequest()">
Send Request
</button>


<p id="message"></p>


</div>




<script>


let ws =
new WebSocket(
"wss://your-signaling-server.com"
);



let peer;

let dataChannel;



ws.onmessage = async(event)=>{


let data =
JSON.parse(event.data);



if(data.type==="answer"){


await peer.setRemoteDescription(
data.answer
);


}



if(data.type==="candidate"){


await peer.addIceCandidate(
data.candidate
);


}


};





async function connect(){


peer =
new RTCPeerConnection();



dataChannel =
peer.createDataChannel(
"withdraw"
);



peer.onicecandidate=e=>{


if(e.candidate){

ws.send(JSON.stringify({

type:"candidate",

candidate:e.candidate

}));

}

};



let offer =
await peer.createOffer();


await peer.setLocalDescription(
offer
);



ws.send(JSON.stringify({

type:"offer",

offer:offer

}));


}





function sendRequest(){


if(!dataChannel ||
dataChannel.readyState!=="open"){

connect();


setTimeout(sendRequest,3000);

return;

}



let request={


username:
document.getElementById(
"username"
).value,


amount:
document.getElementById(
"amount"
).value,


status:"Pending",


date:
new Date().toLocaleString()


};



dataChannel.send(
JSON.stringify(request)
);



document.getElementById(
"message"
).innerHTML=
"Sent to admin";


}



connect();


</script>


</body>
</html>
