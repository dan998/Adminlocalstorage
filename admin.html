<!DOCTYPE html>
<html>
<head>
<title>Admin Withdrawal Panel</title>

<style>
body{
font-family:Arial;
background:#0f172a;
color:white;
padding:30px;
}

.box{
max-width:500px;
margin:auto;
background:#1e293b;
padding:20px;
border-radius:10px;
}

.request{
background:#334155;
padding:15px;
margin-top:15px;
border-radius:8px;
}
</style>

</head>

<body>

<div class="box">

<h2>Admin Dashboard</h2>

<p id="status">
Waiting for user...
</p>

<div id="requests"></div>

</div>


<script>

let ws;

let peer;

let dataChannel;


// Connect signaling server

ws = new WebSocket(
"wss://your-signaling-server.com"
);



ws.onopen = ()=>{

document.getElementById("status").innerHTML =
"Admin online";

};



// Receive user offer

ws.onmessage = async(event)=>{


let data = JSON.parse(event.data);



if(data.type==="offer"){


createPeer();



await peer.setRemoteDescription(
data.offer
);



let answer =
await peer.createAnswer();


await peer.setLocalDescription(answer);



ws.send(JSON.stringify({

type:"answer",

answer:answer

}));


}


if(data.type==="candidate"){

await peer.addIceCandidate(
data.candidate
);

}


};





function createPeer(){


peer =
new RTCPeerConnection();



peer.onicecandidate = e=>{


if(e.candidate){

ws.send(JSON.stringify({

type:"candidate",

candidate:e.candidate

}));

}

};



peer.ondatachannel = e=>{


dataChannel=e.channel;



dataChannel.onmessage=e=>{


let request =
JSON.parse(e.data);



document.getElementById(
"requests"
).innerHTML +=
`
<div class="request">

<b>User:</b>
${request.username}
<br>

<b>Amount:</b>
${request.amount}

<br>

<b>Status:</b>
${request.status}

<br>

<b>Date:</b>
${request.date}

</div>
`;



};


};



}


</script>


</body>
</html>
